name: Keep Workflows Alive

# GitHub auto-disables scheduled workflows after 60 days with no repository push
# activity — a workflow simply *running* does not reset that clock, only a git push
# does. This job commits a tiny heartbeat file weekly (well under the 60-day limit)
# purely to keep schedule-check.yml enabled. It does not touch app data or Firebase.
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Update heartbeat file
        run: |
          mkdir -p .github/keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive/last-ping.txt
      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive/last-ping.txt
          git diff --cached --quiet || git commit -m "chore: keep-alive ping"
          git push
